<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RV Sale Dash</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; }
        #game-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="phaser-game"></div>
    </div>

    <div id="email-capture-form" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; background-color: #fff; padding: 20px; border: 2px solid #000; text-align: center;">
        <p>Enter your email for a Turbo Deal Pack!</p>
        <input type="email" id="email-input" placeholder="your.email@example.com" style="margin-bottom: 10px; padding: 5px; width: 80%;">
        <button id="submit-email-button" style="padding: 5px 10px;">Submit</button>
        <p id="email-thanks-message" style="display: none; color: green; margin-top: 10px;">Thanks for signing up!</p>
        <p id="email-error-message" style="display: none; color: red; margin-top: 10px;">Please enter a valid email.</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
